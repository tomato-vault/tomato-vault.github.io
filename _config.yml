# Config
# ========================================================================================

url:                   https://tomato-vault.github.io
baseurl:               ''

# General settings
# ---------------------------------------------------------------------------------------

lang:                  ko-KR
title:                 토마토 볼트
timezone:              Asia/Seoul

description:           >
  기록의 악마와 코딩하는 기계들 — AI 협업, 워크플로우, 개발 일지

tagline:               기록의 악마와 코딩하는 기계들
keywords:              ["AI", "Agent", "Workflow", "TDD", "Obsidian", "Python"]
logo:                  /assets/img/logo.png

author:
  name:                토마토
  social:
    github:            tomato-vault

legal:
  - title:             LICENSE
    url:               /licenses/
  - title:             DOCS
    url:               /docs/

copyright:             © 2026. All rights reserved.

permalink:             /:categories/:title
paginate:              5
paginate_path:         /:num/
excerpt_separator:     <!--more-->

# Theme
# ---------------------------------------------------------------------------------------

theme:                 jekyll-theme-hydejack

# Customization
# ----------------------------------------------------------------------------------------

accent_image:          /assets/img/sidebar-bg.jpg
accent_color:          rgb(79,177,186)
theme_color:           rgb(25,55,71)

google_fonts:          Fira Code
font:                  Fira Code
font_heading:          Fira Code
font_code:             Fira Code

defaults:
  - scope:
      path:            assets/**
    values:
      sitemap:         false

  - scope:
      path:            licenses/
    values:
      layout:          plain
      sitemap:         false

  - scope:
      type:            posts
    values:
      comments:        true

  - scope:
      type:            projects
    values:
      seo:
        type:          WebPage
  - scope:
      type:            featured_categories
    values:
      seo:
        type:          WebPage
  - scope:
      type:            featured_tags
    values:
      seo:
        type:          WebPage

kramdown:
  math_engine:         mathjax
  math_engine_opts:    {}
  footnote_backlink:   '&#x21a9;&#xfe0e;'

# 3rd Party Integrations
# ----------------------------------------------------------------------------------------

comments:
  provider:            utterances

utterances:
  repo:                "tomato-vault/tomato-vault.github.io"
  issue-term:          "pathname"
  label:               "Comments"
  theme:               "github-light"

# Hydejack Settings
# ----------------------------------------------------------------------------------------

hydejack:
  post_addons:         [about, related, comments]
  project_addons:      [about, comments]
  no_mark_external:    false
  no_push_state:       false
  no_drawer:           false
  no_navbar:           false
  no_search:           false
  no_inline_css:       false
  no_page_style:       false
  no_break_layout:     true
  no_toc:              false
  no_third_column:     false
  no_large_headings:   false
  no_structured_data:  false
  no_theme_color:      false
  no_breadcrumbs:      false
  use_lsi:             false
  cookies_banner:      false
  advertise:           false
  hide_dates:          false
  hide_last_modified:  false
  dark_mode:
    always:            false
    dynamic:           false
    icon:              false
  offline:
    enabled:           false
    cache_version:     1
    precache_assets:
      - /assets/img/swipe.svg

# Collections
# ----------------------------------------------------------------------------------------

collections:
  featured_categories:
    permalink:         /:name/
    output:            true

  featured_tags:
    permalink:         /tag-:name/
    output:            true

  projects:
    permalink:         /projects/:path/
    output:            true

# File inclusion/exclusion
# ----------------------------------------------------------------------------------------

exclude:
  - .jekyll-cache
  - .sass-cache
  - '*.toml'
  - vendor
  - Gemfile
  - Gemfile.lock
  - node_modules
  - package.json
  - package-lock.json
  - scripts
  - AGENTS.md
  - CLAUDE.md
  - .githooks

include:
  - .well-known
  - LICENSE.md

# Plugins
# ----------------------------------------------------------------------------------------

plugins:
  - jekyll-default-layout
  - jekyll-feed
  - jekyll-optional-front-matter
  - jekyll-paginate
  - jekyll-readme-index
  - jekyll-redirect-from
  - jekyll-relative-links
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-titles-from-headings
  - jekyll-include-cache
  - jekyll-last-modified-at

# Plugin Configs
# ---------------------------------------------------------------------------------------
optional_front_matter:
  remove_originals:    true

readme_index:
  remove_originals:    true
  with_frontmatter:    true

relative_links:
  collections:         true

titles_from_headings:
  strip_title:         true
  collections:         true

compress_html:
  comments:            ["<!--", "-->"]
  clippings:           all
  endings:             all
  ignore:
    envs:              [development]

sass:
  style:               compressed

jekyll_compose:
  default_front_matter:
    drafts:
      layout: post
      description: > 
        A short ~160 character description of your post for search engines
      image:
        path: /assets/img/sidebar-bg.jpg
    posts:
      layout: post
      description: > 
        A short ~160 character description of your post for search engines
      image:
        path: /assets/img/sidebar-bg.jpg
